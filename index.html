<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta property="og:title" content="It's 5 O’Clock Somewhere - Greatonthelakes.com" />
  <meta property="og:description" content="This'll show you where it's 5PM" />
  <meta property="og:url" content="https://www.greatonthelakes.com/index.html"/>
  <meta property="og:image" content="https://www.greatonthelakes.com/images/GOTL.png" />
  <meta property="og:type" content="website" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="https://www.greatonthelakes.com/images/GOTL.svg">
  <title>It’s 5 O’Clock Somewhere</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    body, html { margin: 0; height: 100%; }
    #map { height: 100%; }
    .info {
      position: absolute;
      top: 10px; left: 10px;
      background: white; padding: 8px;
      border-radius: 6px;
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
      font-family: sans-serif;
      max-width: 250px;
      z-index: 1000;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info" id="info">Loading...</div>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
  // Create map with attribution control enabled
  var map = L.map('map', {
    attributionControl: true
  }).setView([20, 0], 2);

  // Remove default "Leaflet" attribution text
  map.attributionControl.setPrefix(false);

  // Add OSM tiles
  L.tileLayer('https://api.maptiler.com/maps/streets/{z}/{x}/{y}.png?param1=value1&param2=value2&key=pkoQYQoPVqLwQYA9mU96', {
    // don't need default attribution since you're replacing it
  }).addTo(map);

  // GeoJSON of world timezones
  const TZ_GEOJSON = "combined-with-oceans-now.json";
  const infoBox = document.getElementById("info");
  let tzLayer;

  // Map bounds
  const bounds = [
    [-90, -210],
    [90, 210]
  ];
  map.setMaxBounds(bounds);
  map.setMinZoom(2);

  // Check if current hour in a timezone is 5 PM
  function isFiveOClock(tz) {
    try {
      const parts = new Intl.DateTimeFormat("en-US", {
        hour: "2-digit", hour12: false,
        timeZone: tz
      }).formatToParts(new Date());
      const hour = Number(parts.find(p => p.type === "hour")?.value || 0);
      return hour === 17;
    } catch (e) {
      return false;
    }
  }

  // Update map highlights
  function updateLayer(data) {
    if (tzLayer) {
      map.removeLayer(tzLayer);
    }

    tzLayer = L.geoJSON(data, {
      style: f => ({
        color: "#555",
        weight: 0.5,
        fillColor: isFiveOClock(f.properties.tzid) ? "orange" : "transparent",
        fillOpacity: isFiveOClock(f.properties.tzid) ? 0.6 : 0
      }),
      onEachFeature: (f, l) => {
        if (isFiveOClock(f.properties.tzid)) {
          l.bindPopup(`<b>${f.properties.tzid}</b><br>It’s 5 o’clock here!`);
        }
        else {
          l.bindPopup(`<b>${f.properties.tzid}</b><br>It’s not 5 o’clock here!`);
        }
      }
    }).addTo(map);

    const fiveZones = data.features.filter(f => isFiveOClock(f.properties.tzid));
    if (fiveZones.length) {
      infoBox.innerHTML = "It’s 5 o’clock in:<br>" + fiveZones.map(f => f.properties.tzid).join("<br>");
    } else {
      infoBox.innerHTML = "No places are in the 5 PM hour right now (wait a sec).";
    }
  }

  // Load GeoJSON once
  fetch(TZ_GEOJSON).then(r => r.json()).then(data => {
    updateLayer(data);
    setInterval(() => updateLayer(data), 60000);
  });

  // Custom attribution text
  map.attributionControl.addAttribution(
    `Made by <a href="https://www.greatonthelakes.com/" target="_blank">Great On The Lakes.com (GOTLcom)</a> | 
     Map Powered by <a href="https://leafletjs.com/" target="_blank">Leaflet JS</a> Technology | OSM Tiles From <a href="https://maptiler.com/" target="_blank">MapTiler</a> | <a href="https://www.openstreetmap.org/" target="_blank">OpenStreetMap</a> services`
  );
</script>

</body>
</html>
